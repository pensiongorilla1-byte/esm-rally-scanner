<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ESM Rally 2026 - Entry Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #eef2f7;
  color: #1f2937;
}

.header {
  background: #1f2937;
  color: white;
  text-align: center;
  padding: 20px 10px;
}

.header h1 {
  margin: 0;
  font-size: 24px;
}

.header p {
  margin: 6px 0 0;
  font-size: 14px;
}

.container {
  width: 100%;
  max-width: 600px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow:
    0 3px 12px rgba(0,0,0,0.08);
}

.scannerTitle {
  text-align: center;
  margin-top: 0;
}

#reader {
  width: 100%;
  max-width: 450px;
  margin: 15px auto;
  overflow: hidden;
  border-radius: 10px;
}

#reader video {
  width: 100% !important;
  height: auto !important;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 8px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.startButton {
  background: #2563eb;
  color: white;
}

.stopButton {
  background: #dc2626;
  color: white;
  margin-top: 10px;
}

.entryButton {
  background: #16a34a;
  color: white;
  margin-top: 20px;
}

.entryButton:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.nextButton {
  background: #374151;
  color: white;
  margin-top: 10px;
}

.status {
  text-align: center;
  margin-top: 12px;
  min-height: 20px;
  font-size: 14px;
  color: #475569;
}

.manual {
  display: flex;
  gap: 8px;
}

.manual input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 17px;
  text-transform: uppercase;
  outline: none;
}

.manual input:focus {
  border-color: #2563eb;
}

.searchButton {
  width: auto;
  background: #2563eb;
  color: white;
  padding-left: 20px;
  padding-right: 20px;
}

#result {
  display: none;
}

.successCard {
  border: 5px solid #16a34a;
}

.warningCard {
  border: 5px solid #f59e0b;
}

.dangerCard {
  border: 5px solid #dc2626;
}

.successTitle {
  color: #15803d;
  font-size: 28px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 15px;
}

.warningTitle {
  color: #d97706;
  font-size: 27px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 15px;
}

.dangerTitle {
  color: #dc2626;
  font-size: 27px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 15px;
}

.details {
  margin-top: 15px;
}

.details div {
  padding: 11px 5px;
  border-bottom: 1px solid #e5e7eb;
  font-size: 16px;
}

.label {
  font-weight: bold;
}

@media (max-width: 500px) {

  .header h1 {
    font-size: 21px;
  }

  .container {
    padding: 10px;
  }

  .card {
    padding: 15px;
  }

  .manual {
    flex-direction: column;
  }

  .searchButton {
    width: 100%;
  }

  .successTitle {
    font-size: 25px;
  }

  .warningTitle {
    font-size: 24px;
  }

  .dangerTitle {
    font-size: 24px;
  }

}

</style>

</head>


<body>


<div class="header">

  <h1>
    ESM RALLY 2026
  </h1>

  <p>
    MOBILE ENTRY SCANNER
  </p>

</div>


<div class="container">


<!-- =====================================================
     QR SCANNER
     ===================================================== -->

<div class="card">

  <h2 class="scannerTitle">
    QR Code Scanner
  </h2>

  <div id="reader"></div>

  <button
    id="startButton"
    class="startButton"
    onclick="startScanner()">

    📷 START QR SCANNER

  </button>

  <button
    id="stopButton"
    class="stopButton"
    onclick="stopScanner()"
    style="display:none;">

    STOP SCANNER

  </button>

  <div
  id="status"
  class="status">
</div>

<!-- USB QR SCANNER -->

<button
  id="usbStartButton"
  class="startButton"
  onclick="startUSBScanner()"
  style="margin-top:10px;">

  🔌 ACTIVATE USB QR SCANNER

</button>

<input
  type="text"
  id="usbScannerInput"
  autocomplete="off"
  style="
    position:absolute;
    left:-10000px;
    top:-10000px;
    width:1px;
    height:1px;
    opacity:0;
    pointer-events:none;
  "
>

<div
  id="usbStatus"
  class="status">
  USB scanner not activated.
</div>

</div>


<!-- =====================================================
     MANUAL REGID SEARCH
     ===================================================== -->

<div class="card">

  <h3>
    Manual REGID Search
  </h3>

  <div class="manual">

    <input
      type="text"
      id="regIdInput"
      placeholder="REGID-0001"
      autocomplete="off"
    >

    <button
      class="searchButton"
      onclick="manualSearch()">

      SEARCH

    </button>

  </div>

</div>


<!-- =====================================================
     RESULT
     ===================================================== -->

<div
  id="result"
  class="card">

  <div
    id="resultTitle">
  </div>

  <div
    id="details"
    class="details">
  </div>

  <button
    id="entryButton"
    class="entryButton"
    onclick="allowEntry()">

    ALLOW ENTRY

  </button>

  <button
    id="nextButton"
    class="nextButton"
    onclick="resetScanner()">

    SCAN NEXT PARTICIPANT

  </button>

</div>


</div>


<script>


// ==========================================================
// GOOGLE APPS SCRIPT WEB APP URL
// ==========================================================

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbz22ldUhMO2D1p_CwJpkxrZfaepV2Il62XP_B5d80NOxFVPJ0KtRpO3mt_ZN-fjDIqnDw/exec";


// ==========================================================
// GLOBAL VARIABLES
// ==========================================================

let scanner = null;

let scannerRunning = false;

let currentRegId = "";

let currentParticipant = null;

let usbScannerActive = false;


// ==========================================================
// START SCANNER
// ==========================================================

function startScanner() {

  if (scannerRunning) {
    return;
  }

  const status =
    document.getElementById("status");

  const startButton =
    document.getElementById("startButton");

  const stopButton =
    document.getElementById("stopButton");


  status.innerText =
    "Starting camera...";


  startButton.disabled =
    true;


  scanner =
    new Html5Qrcode("reader");


  const cameraConfig = {
    facingMode: "environment"
  };


  const qrConfig = {

    fps: 10,

    qrbox: function(
      viewfinderWidth,
      viewfinderHeight
    ) {

      let size =
        Math.min(
          viewfinderWidth,
          viewfinderHeight
        ) * 0.70;


      size =
        Math.max(
          220,
          size
        );


      size =
        Math.min(
          300,
          size
        );


      return {
        width: size,
        height: size
      };

    }

  };


  scanner.start(

    cameraConfig,

    qrConfig,

    function(decodedText) {

      handleQRCode(decodedText);

    },

    function(errorMessage) {

      // Normal scanning errors are ignored.

    }

  )

  .then(function() {

    scannerRunning =
      true;

    startButton.disabled =
      false;

    startButton.style.display =
      "none";

    stopButton.style.display =
      "block";

    status.innerText =
      "Camera ready. Scan the QR code.";

  })

  .catch(function(error) {

    console.error(
      "Camera error:",
      error
    );

    scannerRunning =
      false;

    startButton.disabled =
      false;

    startButton.style.display =
      "block";

    stopButton.style.display =
      "none";

    status.innerText =
      "Camera could not be started. " +
      "Please allow camera permission.";

  });

}

// ==========================================================
// USB QR SCANNER
// ==========================================================

function startUSBScanner() {

  const input =
    document.getElementById("usbScannerInput");

  const status =
    document.getElementById("usbStatus");

  usbScannerActive = true;

  input.value = "";

  input.focus();

  status.innerText =
    "USB QR Scanner ready. Scan the QR code.";

}

// ==========================================================
// STOP SCANNER
// ==========================================================

function stopScanner() {

  if (!scanner) {

    scannerRunning =
      false;

    return;

  }


  scanner
    .stop()

    .then(function() {

      try {
        scanner.clear();
      }

      catch (e) {
        console.log(e);
      }


      scanner = null;

      scannerRunning =
        false;


      document
        .getElementById("startButton")
        .style.display =
        "block";


      document
        .getElementById("startButton")
        .disabled =
        false;


      document
        .getElementById("stopButton")
        .style.display =
        "none";

    })

    .catch(function(error) {

      console.log(
        "Scanner stop error:",
        error
      );


      scanner = null;

      scannerRunning =
        false;

    });

}


// ==========================================================
// QR CODE DETECTED
// ==========================================================

function handleQRCode(value) {

  value =
    String(value || "")
      .trim()
      .toUpperCase();


  if (!value) {
    return;
  }


  if (
    currentRegId === value
  ) {
    return;
  }


  currentRegId =
    value;


  stopScanner();


  document
    .getElementById("status")
    .innerText =
    "QR detected. Checking registration...";


  processRegId(value);

}


// ==========================================================
// PROCESS REGID
// ==========================================================

function processRegId(regId) {

  regId =
    String(regId || "")
      .trim()
      .toUpperCase();


  if (!regId) {

    showError(
      "Registration ID is empty."
    );

    return;

  }


  currentRegId =
    regId;


  document
    .getElementById("status")
    .innerText =
    "Checking " + regId + "...";


  const url =
    SCRIPT_URL +
    "?action=find&regid=" +
    encodeURIComponent(regId);


  fetch(
    url,
    {
      method: "GET",
      cache: "no-store"
    }
  )

  .then(function(response) {

    if (!response.ok) {

      throw new Error(
        "Server returned HTTP " +
        response.status
      );

    }


    return response.json();

  })

  .then(function(result) {

    displayParticipant(result);

  })

  .catch(function(error) {

    console.error(
      "Lookup error:",
      error
    );


    showError(
      "Unable to connect to registration server."
    );

  });

}


// ==========================================================
// DISPLAY ONLY THE FOUR ALLOWED FIELDS
// ==========================================================

function displayParticipant(result) {

  const resultBox =
    document.getElementById("result");

  const title =
    document.getElementById("resultTitle");

  const details =
    document.getElementById("details");

  const entryButton =
    document.getElementById("entryButton");


  resultBox.style.display =
    "block";


  currentParticipant =
    result;


  // ========================================================
  // INVALID
  // ========================================================

  if (
    !result.success 
  ) {

    resultBox.className =
      "card dangerCard";


    title.className =
      "dangerTitle";


    title.innerHTML =
      "✕ INVALID REGISTRATION";


    details.innerHTML =

      "<div>" +

      safe(
        result.message ||
        "Registration not found."
      ) +

      "</div>";


    entryButton.style.display =
      "none";


    return;

  }


  // ========================================================
  // ALREADY ENTERED
  // ========================================================

  if (

    String(
      result.entryStatus || ""
    )
      .trim()
      .toLowerCase() ===
    "entered"

  ) {

    resultBox.className =
      "card warningCard";


    title.className =
      "warningTitle";


    title.innerHTML =
      "⚠ ALREADY ENTERED";


    details.innerHTML =

      "<div>" +
      "<span class='label'>REGID:</span> " +
      safe(result.regId) +
      "</div>" +

      "<div>" +
      "<span class='label'>Name:</span> " +
      safe(result.name) +
      "</div>" +

      "<div>" +
      "<span class='label'>Entry Status:</span> " +
      safe(result.entryStatus) +
      "</div>" +

      "<div>" +
      "<span class='label'>Entry Time:</span> " +
      safe(result.entryTime) +
      "</div>";


    entryButton.style.display =
      "none";


    return;

  }


  // ========================================================
  // VALID - NOT ENTERED
  // ========================================================

  resultBox.className =
    "card successCard";


  title.className =
    "successTitle";


  title.innerHTML =
    "✓ REGISTRATION VERIFIED";


  details.innerHTML =

    "<div>" +
    "<span class='label'>REGID:</span> " +
    safe(result.regId) +
    "</div>" +

    "<div>" +
    "<span class='label'>Name:</span> " +
    safe(result.name) +
    "</div>" +

    "<div>" +
    "<span class='label'>Entry Status:</span> " +
    safe(result.entryStatus) +
    "</div>" +

    "<div>" +
    "<span class='label'>Entry Time:</span> " +
    safe(result.entryTime || "—") +
    "</div>";


  entryButton.style.display =
    "block";


  entryButton.disabled =
    false;


  entryButton.innerText =
    "ALLOW ENTRY";

}


// ==========================================================
// ALLOW ENTRY
// ==========================================================

function allowEntry() {

  if (!currentRegId) {

    showError(
      "No Registration ID selected."
    );

    return;

  }


  const button =
    document.getElementById(
      "entryButton"
    );


  button.disabled =
    true;


  button.innerText =
    "PROCESSING...";


  const url =
    SCRIPT_URL +
    "?action=entry&regid=" +
    encodeURIComponent(
      currentRegId
    );


  fetch(

    url,

    {
      method: "GET",
      cache: "no-store"
    }

  )

  .then(function(response) {

    if (!response.ok) {

      throw new Error(
        "Server returned HTTP " +
        response.status
      );

    }


    return response.json();

  })

  .then(function(result) {

    processEntryResult(result);

  })

  .catch(function(error) {

    console.error(
      "Entry error:",
      error
    );


    button.disabled =
      false;


    button.innerText =
      "ALLOW ENTRY";


    showError(
      "Unable to connect to registration server."
    );

  });

}


// ==========================================================
// PROCESS ENTRY RESULT
// ==========================================================

function processEntryResult(result) {

  const resultBox =
    document.getElementById("result");

  const title =
    document.getElementById("resultTitle");

  const details =
    document.getElementById("details");

  const button =
    document.getElementById("entryButton");


  // ========================================================
  // ENTRY ALLOWED
  // ========================================================

  if (
    result.success 
  ) {

    resultBox.className =
      "card successCard";


    title.className =
      "successTitle";


    title.innerHTML =
      "✓ ENTRY ALLOWED";


    details.innerHTML =

      "<div>" +
      "<span class='label'>REGID:</span> " +
      safe(currentParticipant.regId) +
      "</div>" +

      "<div>" +
      "<span class='label'>Name:</span> " +
      safe(currentParticipant.name) +
      "</div>" +

      "<div>" +
      "<span class='label'>Entry Status:</span> " +
      "Entered" +
      "</div>" +

      "<div>" +
      "<span class='label'>Entry Time:</span> " +
      safe(result.entryTime) +
      "</div>";


    button.style.display =
      "none";


    return;

  }


  // ========================================================
  // ALREADY ENTERED
  // ========================================================

  if (
    result.alreadyEntered
  ) {

    resultBox.className =
      "card warningCard";


    title.className =
      "warningTitle";


    title.innerHTML =
      "⚠ ALREADY ENTERED";


    details.innerHTML =

      "<div>" +
      "<span class='label'>REGID:</span> " +
      safe(currentParticipant.regId) +
      "</div>" +

      "<div>" +
      "<span class='label'>Name:</span> " +
      safe(currentParticipant.name) +
      "</div>" +

      "<div>" +
      "<span class='label'>Entry Status:</span> " +
      "Entered" +
      "</div>" +

      "<div>" +
      "<span class='label'>Entry Time:</span> " +
      safe(result.entryTime) +
      "</div>";


    button.style.display =
      "none";


    return;

  }


  button.disabled =
    false;


  button.innerText =
    "ALLOW ENTRY";


  showError(
    result.message ||
    "Entry could not be recorded."
  );

}


// ==========================================================
// MANUAL REGID SEARCH
// ==========================================================

function manualSearch() {

  const input =
    document.getElementById(
      "regIdInput"
    );


  const regId =
    input.value
      .trim()
      .toUpperCase();


  if (!regId) {

    alert(
      "Please enter a Registration ID."
    );

    return;

  }


  stopScanner();


  processRegId(regId);

}


// ==========================================================
// RESET
// ==========================================================

function resetScanner() {

  stopScanner();


  currentRegId =
    "";

  currentParticipant =
    null;


  document
    .getElementById("result")
    .style.display =
    "none";


  document
    .getElementById("regIdInput")
    .value =
    "";


  document
    .getElementById("status")
    .innerText =
    "";


  const entryButton =
    document.getElementById(
      "entryButton"
    );


  entryButton.style.display =
    "block";


  entryButton.disabled =
    false;


  entryButton.innerText =
    "ALLOW ENTRY";

}


// ==========================================================
// ERROR
// ==========================================================

function showError(message) {

  const resultBox =
    document.getElementById(
      "result"
    );

  const title =
    document.getElementById(
      "resultTitle"
    );

  const details =
    document.getElementById(
      "details"
    );


  resultBox.style.display =
    "block";


  resultBox.className =
    "card dangerCard";


  title.className =
    "dangerTitle";


  title.innerHTML =
    "✕ ERROR";


  details.innerHTML =
    "<div>" +
    safe(message) +
    "</div>";

}


// ==========================================================
// HTML SAFETY
// ==========================================================

function safe(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// ==========================================================
// ENTER KEY
// ==========================================================

document
  .getElementById("regIdInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        manualSearch();

      }

    }
  );
  
// AUTO FOCUS USB QR SCANNER

window.addEventListener("load", function() {
  startUSBScanner();
});

// ==========================================================
// USB QR SCANNER INPUT
// ==========================================================

document
  .getElementById("usbScannerInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        usbScannerActive
      ) {

        event.preventDefault();

        const value =
          this.value.trim().toUpperCase();

        if (!value) {
          return;
        }

        this.value = "";

        usbScannerActive = false;

        processRegId(value);

      }

    }
  );
  
</script>

</body>

</html>
